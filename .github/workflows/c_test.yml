name: c_test

on:
  workflow_call:
    inputs:
      cc:
        type: string
        required: true
      config:
        type: string
        required: true
      image:
        type: string
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: ${{ inputs.image }}
    env:
      CC: ${{ inputs.cc }}
      BUILD_TYPE: ${{ inputs.config == 'debug' && 'Debug' || 'Release' }}
      SANITIZER: ${{ inputs.config == 'debug' && 'ON' || 'OFF' }}
    steps:
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends cmake ninja-build > /dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DDIANA_BUILD_TEST=ON -DDIANA_SANITIZER="$SANITIZER" -DDIANA_WERROR=ON -DDIANA_BUILD_PYTHON=OFF -DCMAKE_C_COMPILER="$CC"
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testing-${{ inputs.cc }}-${{ inputs.config }}
          path: build/Testing
          retention-days: 7
