name: ci

on:
  push:
    branches: ['**']
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

# A run on the default branch has a group of its own, so it is never cancelled and style_git
# checks every push there; elsewhere a newer push cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

env:
  UV_LINK_MODE: copy

jobs:
  change:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      any: ${{ steps.change.outputs.any }}
      c: ${{ steps.change.outputs.c }}
      python: ${{ steps.change.outputs.python }}
      style: ${{ steps.change.outputs.style }}
      style_c: ${{ steps.change.outputs.style_c }}
      frama_c: ${{ steps.change.outputs.frama_c }}
      lean: ${{ steps.change.outputs.lean }}
      rocq: ${{ steps.change.outputs.rocq }}
      provenance: ${{ steps.change.outputs.provenance }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: change
        shell: bash
        run: python3 script/ci_change.py --event "$EVENT" --ref "$REF" --before "$BEFORE" --sha "$SHA" --default-branch "$DEFAULT_BRANCH" | tee -a "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

  # stage style

  style_git:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - shell: bash
        run: |
          if [ "$REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
            export CI_COMMIT_BEFORE_SHA="$BEFORE"
          elif [ "${REF#refs/heads/}" != "$REF" ]; then
            CI_MERGE_REQUEST_DIFF_BASE_SHA=$(git merge-base "origin/$DEFAULT_BRANCH" "$CI_COMMIT_SHA" || true)
            export CI_MERGE_REQUEST_DIFF_BASE_SHA
          fi
          script/check_commit.sh
        env:
          CI_COMMIT_SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

  style_name:
    needs: change
    if: ${{ needs.change.outputs.any == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          bad=$(find . -maxdepth 2 -type d \( -name tests -o -name docs -o -name scripts -o -name proofs -o -name wrappers -o -name tools \) -not -path "./.git/*" -not -path "./.venv/*" -not -path "./build/*")
          if [ -n "$bad" ]; then echo "plural directory name not allowed: $bad"; exit 1; fi

  style_c:
    needs: change
    if: ${{ needs.change.outputs.style_c == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: ghcr.io/astral-sh/uv:python3.13-bookworm-slim@sha256:531f855bda2c73cd6ef67d56b733b357cea384185b3022bd09f05e002cd144ca
    env:
      UV_CACHE_DIR: .cache/uv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/uv
          key: uv-${{ github.job }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ github.job }}-
      - run: uv --version
      - run: uv sync --only-group lint
      - run: uv run --no-sync clang-format --version
      - run: find include src test/c test/install python/ext benchmark -name '*.[ch]' -print0 | xargs -0 uv run --no-sync clang-format --dry-run --Werror

  style_python:
    needs: change
    if: ${{ needs.change.outputs.style == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: ghcr.io/astral-sh/uv:python3.13-bookworm-slim@sha256:531f855bda2c73cd6ef67d56b733b357cea384185b3022bd09f05e002cd144ca
    env:
      UV_CACHE_DIR: .cache/uv
      SKBUILD_CMAKE_DEFINE: DIANA_WERROR=ON
    steps:
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends build-essential cmake ninja-build > /dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/uv
          key: uv-${{ github.job }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ github.job }}-
      - run: uv --version
      - run: uv sync --group lint --group spec
      - run: uv run ruff check python test/python test/doc script
      - run: uv run ruff format --check python test/python test/doc script
      - run: uv run script/check_spec.py --no-report
      - run: uv run script/check_doc.py

  # stages build and test: each GitLab build_<cc>_<config> and test_<cc>_<config> pair is one job

  test_gcc_debug:
    needs: [change, style_c]
    if: ${{ !failure() && !cancelled() && needs.change.outputs.c == 'true' }}
    uses: ./.github/workflows/c_test.yml
    with:
      cc: gcc
      config: debug
      image: gcc:14@sha256:6f37e44a9b41181de5dd97366ec732652f5d895a72b5549c64694efed50a97e8

  test_gcc_release:
    needs: [change, style_c]
    if: ${{ !failure() && !cancelled() && needs.change.outputs.c == 'true' }}
    uses: ./.github/workflows/c_test.yml
    with:
      cc: gcc
      config: release
      image: gcc:14@sha256:6f37e44a9b41181de5dd97366ec732652f5d895a72b5549c64694efed50a97e8

  test_clang_debug:
    needs: [change, style_c]
    if: ${{ !failure() && !cancelled() && needs.change.outputs.c == 'true' }}
    uses: ./.github/workflows/c_test.yml
    with:
      cc: clang
      config: debug
      image: silkeh/clang:18@sha256:3914c93a02e866795aafc80737488e515b96390eff3d2787cf8c5095997baea9

  test_clang_release:
    needs: [change, style_c]
    if: ${{ !failure() && !cancelled() && needs.change.outputs.c == 'true' }}
    uses: ./.github/workflows/c_test.yml
    with:
      cc: clang
      config: release
      image: silkeh/clang:18@sha256:3914c93a02e866795aafc80737488e515b96390eff3d2787cf8c5095997baea9

  test_macos:
    name: test_macos_${{ matrix.config }}
    needs: [change, style_c]
    if: ${{ !failure() && !cancelled() && needs.change.outputs.c == 'true' }}
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: debug
            build_type: Debug
            sanitizer: 'ON'
          - config: release
            build_type: Release
            sanitizer: 'OFF'
    env:
      CC: clang
      BUILD_TYPE: ${{ matrix.build_type }}
      SANITIZER: ${{ matrix.sanitizer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DDIANA_BUILD_TEST=ON -DDIANA_SANITIZER="$SANITIZER" -DDIANA_WERROR=ON -DDIANA_BUILD_PYTHON=OFF -DCMAKE_C_COMPILER="$CC"
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testing-macos-${{ matrix.config }}
          path: build/Testing
          retention-days: 7

  test_install:
    needs: [change, test_gcc_release]
    if: ${{ !failure() && !cancelled() && needs.change.outputs.c == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: gcc:14@sha256:6f37e44a9b41181de5dd97366ec732652f5d895a72b5549c64694efed50a97e8
    env:
      CC: gcc
    steps:
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends cmake ninja-build > /dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cmake -S . -B build/install-custom -G Ninja -DCMAKE_BUILD_TYPE=Release -DDIANA_BUILD_TEST=ON -DDIANA_BUILD_PYTHON=OFF -DDIANA_WERROR=ON -DCMAKE_C_COMPILER="$CC" -DCMAKE_INSTALL_INCLUDEDIR=include/custom
      - run: cmake --build build/install-custom
      - run: ctest --test-dir build/install-custom --output-on-failure
      - run: cmake -S . -B build/install-shared -G Ninja -DCMAKE_BUILD_TYPE=Release -DDIANA_BUILD_TEST=ON -DDIANA_BUILD_PYTHON=OFF -DDIANA_WERROR=ON -DCMAKE_C_COMPILER="$CC" -DDIANA_BUILD_SHARED_LIB=ON
      - run: cmake --build build/install-shared
      - run: ctest --test-dir build/install-shared --output-on-failure

  test_install_macos:
    needs: [change, test_macos]
    if: ${{ !failure() && !cancelled() && needs.change.outputs.c == 'true' }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CC: clang
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cmake -S . -B build/install-custom -G Ninja -DCMAKE_BUILD_TYPE=Release -DDIANA_BUILD_TEST=ON -DDIANA_BUILD_PYTHON=OFF -DDIANA_WERROR=ON -DCMAKE_C_COMPILER="$CC" -DCMAKE_INSTALL_INCLUDEDIR=include/custom
      - run: cmake --build build/install-custom
      - run: ctest --test-dir build/install-custom --output-on-failure
      - run: cmake -S . -B build/install-shared -G Ninja -DCMAKE_BUILD_TYPE=Release -DDIANA_BUILD_TEST=ON -DDIANA_BUILD_PYTHON=OFF -DDIANA_WERROR=ON -DCMAKE_C_COMPILER="$CC" -DDIANA_BUILD_SHARED_LIB=ON
      - run: cmake --build build/install-shared
      - run: ctest --test-dir build/install-shared --output-on-failure

  test_python:
    name: test_python_${{ matrix.python }}
    needs: change
    if: ${{ needs.change.outputs.python == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.12'
            image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim@sha256:e5b65587bce7de595f299855d7385fe7fca39b8a74baa261ba1b7147afa78e58
          - python: '3.13'
            image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim@sha256:531f855bda2c73cd6ef67d56b733b357cea384185b3022bd09f05e002cd144ca
          - python: '3.14'
            image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim@sha256:7cf77f594be8042dab6daa9fe326f90962252268b4f120a7f5dccce4d947e6c1
    env:
      UV_CACHE_DIR: .cache/uv
      UV_PYTHON: ${{ matrix.python }}
      SKBUILD_CMAKE_DEFINE: DIANA_WERROR=ON
    steps:
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends build-essential cmake ninja-build > /dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/uv
          key: uv-${{ github.job }}-${{ matrix.python }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ github.job }}-${{ matrix.python }}-
      - run: uv --version
      - run: uv sync --group test --group lint
      - run: uv run pytest -q
      - run: uv build
      - run: uv run --with twine twine check dist/*
      - run: uv run --no-sync script/check_wheel.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.python }}
          path: dist/
          retention-days: 7

  test_python_macos:
    needs: change
    if: ${{ needs.change.outputs.python == 'true' }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      SKBUILD_CMAKE_DEFINE: DIANA_WERROR=ON
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: false
      - run: uv --version
      - run: uv sync --group test --group lint
      - run: uv run pytest -q
      - run: uv build
      - run: uv run --with twine twine check dist/*
      - run: uv run --no-sync script/check_wheel.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-macos
          path: dist/
          retention-days: 7

  # stage report

  coverage_c:
    needs: [change, test_gcc_debug]
    if: ${{ !failure() && !cancelled() && needs.change.outputs.c == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: ghcr.io/astral-sh/uv:python3.13-bookworm-slim@sha256:531f855bda2c73cd6ef67d56b733b357cea384185b3022bd09f05e002cd144ca
    env:
      UV_CACHE_DIR: .cache/uv
    steps:
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends build-essential cmake ninja-build > /dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/uv
          key: uv-${{ github.job }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ github.job }}-
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DDIANA_BUILD_TEST=ON -DDIANA_WERROR=ON -DDIANA_BUILD_PYTHON=OFF -DCMAKE_C_FLAGS=--coverage -DCMAKE_EXE_LINKER_FLAGS=--coverage
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - run: uv sync --only-group coverage
      - run: mkdir -p coverage/c
      - run: uv run --no-sync gcovr --root . --filter src/ --filter include/ --gcov-exclude-directories '.*/CMakeFiles/[0-9.]+/.*' --print-summary --cobertura coverage/c.xml --html-details coverage/c/index.html build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-c
          path: coverage/
          retention-days: 30

  coverage_python:
    needs: [change, test_python]
    if: ${{ !failure() && !cancelled() && needs.change.outputs.python == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: ghcr.io/astral-sh/uv:python3.13-bookworm-slim@sha256:531f855bda2c73cd6ef67d56b733b357cea384185b3022bd09f05e002cd144ca
    env:
      UV_CACHE_DIR: .cache/uv
      SKBUILD_CMAKE_DEFINE: DIANA_WERROR=ON;CMAKE_C_FLAGS=--coverage;CMAKE_MODULE_LINKER_FLAGS=--coverage
    steps:
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends build-essential cmake ninja-build > /dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/uv
          key: uv-${{ github.job }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ github.job }}-
      - run: uv sync --group test --group coverage --reinstall-package diana
      - run: mkdir -p coverage/python-c
      - run: uv run --no-sync pytest -q --cov=diana --cov-branch --cov-report=term --cov-report=xml:coverage/python.xml --cov-report=html:coverage/python
      - run: uv run --no-sync gcovr --root . --filter python/ext/ --gcov-exclude-directories '.*/CMakeFiles/[0-9.]+/.*' --print-summary --cobertura coverage/python-c.xml --html-details coverage/python-c/index.html build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-python
          path: coverage/
          retention-days: 30

  # stage verify

  verify_frama_c:
    needs: [change, test_gcc_release]
    if: ${{ !failure() && !cancelled() && needs.change.outputs.frama_c == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FRAMA_C_IMAGE: framac/frama-c:32.1@sha256:4f0b7a2bd600c4daabfdcdfa393a3c18301e0db18f3b2739f1d9650193462d36
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: verification/frama-c/cache
          key: wp-${{ env.FRAMA_C_IMAGE }}-${{ hashFiles('script/fetch_alt_ergo.sh') }}-${{ hashFiles('src/**', 'include/**', 'verification/frama-c/expectation.txt', 'script/run_frama_c.sh') }}
          restore-keys: wp-${{ env.FRAMA_C_IMAGE }}-${{ hashFiles('script/fetch_alt_ergo.sh') }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/alt-ergo
          key: alt-ergo-${{ hashFiles('script/fetch_alt_ergo.sh') }}
      - run: script/fetch_alt_ergo.sh .cache/alt-ergo
      - run: chmod -R a+rwX .
      - run: >-
          docker run --rm -v "$PWD:/work" -w /work "$FRAMA_C_IMAGE" sh -c '
          export PATH="/work/.cache/alt-ergo:$PATH" &&
          why3 config detect > /dev/null &&
          alt-ergo --version &&
          frama-c -version &&
          script/verify_frama_c.sh'
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frama-c-report
          path: verification/frama-c/report.txt
          retention-days: 30

  verify_lean:
    needs: change
    if: ${{ needs.change.outputs.lean == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container: debian:bookworm-slim@sha256:7c7b2c966bc9ee8cedfeef67e0e279108992c77681fa595db4a9d65c06ccc587
    steps:
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends curl git ca-certificates zstd python3 python3-yaml > /dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/elan
          key: elan-${{ hashFiles('verification/lean/lean-toolchain') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: verification/lean/.lake/packages
          key: lake-packages-${{ hashFiles('verification/lean/lean-toolchain', 'verification/lean/lake-manifest.json') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: verification/lean/.lake/build
          key: lake-build-${{ hashFiles('verification/lean/lean-toolchain', 'verification/lean/lake-manifest.json') }}-${{ hashFiles('verification/lean/**/*.lean', 'verification/lean/lakefile.toml') }}
          restore-keys: lake-build-${{ hashFiles('verification/lean/lean-toolchain', 'verification/lean/lake-manifest.json') }}-
      - name: install elan
        run: |
          export ELAN_HOME="$GITHUB_WORKSPACE/.cache/elan"
          if [ ! -x "$ELAN_HOME/bin/elan" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh | sh -s -- -y --default-toolchain "$(cat verification/lean/lean-toolchain)"
          fi
          echo "ELAN_HOME=$ELAN_HOME" >> "$GITHUB_ENV"
          echo "$ELAN_HOME/bin" >> "$GITHUB_PATH"
      - run: cd verification/lean && lake exe cache get && lake build
      - run: python3 script/check_spec.py --run --strict --prover lean --no-report

  verify_rocq:
    needs: change
    if: ${{ needs.change.outputs.rocq == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ROCQ_IMAGE: mathcomp/mathcomp:2.6.0-rocq-prover-9.2@sha256:a4e066dbe94d40fbbefc2ab7692abb905011a053d1a5434ababee659ffe293e8
      COQUELICOT_VERSION: 3.4.5
      FLOCQ_VERSION: 4.2.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: chmod -R a+rwX .
      - run: >-
          docker run --rm -v "$PWD:/work" -w /work -e COQUELICOT_VERSION -e FLOCQ_VERSION "$ROCQ_IMAGE" sh -c '
          sudo apt-get update -qq &&
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends python3 python3-yaml > /dev/null &&
          rocq --version &&
          opam update -y rocq-released &&
          opam install -y "coq-coquelicot.$COQUELICOT_VERSION" "coq-flocq.$FLOCQ_VERSION" &&
          make -C verification/rocq float &&
          python3 script/check_spec.py --run --strict --prover rocq --layer A --layer B --no-report'

  verify_provenance:
    needs: change
    if: ${{ needs.change.outputs.provenance == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 script/check_provenance.py
