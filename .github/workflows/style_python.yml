name: style_python

on:
  push:
    branches: ['**']
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
    paths:
      - .github/workflows/**
      - .python-version
      - pyproject.toml
      - uv.lock
      - README.md
      - CONTRIBUTING.md
      - CLAUDE.md
      - doc/**
      - note/**
      - include/**
      - src/**
      - python/**
      - test/python/**
      - test/doc/**
      - script/**
      - spec/**
      - verification/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style_python:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: ghcr.io/astral-sh/uv:python3.13-bookworm-slim@sha256:531f855bda2c73cd6ef67d56b733b357cea384185b3022bd09f05e002cd144ca
    env:
      UV_LINK_MODE: copy
      SKBUILD_CMAKE_DEFINE: DIANA_WERROR=ON
    steps:
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends build-essential cmake ninja-build > /dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: uv --version
      - run: uv sync --group lint --group spec
      - run: uv run ruff check python test/python test/doc script
      - run: uv run ruff format --check python test/python test/doc script
      - run: uv run script/check_spec.py --no-report
      - run: uv run script/check_doc.py
