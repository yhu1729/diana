name: verify_lean

on:
  push:
    branches: ['**']
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
    paths:
      - .github/workflows/verify_lean.yml
      - verification/lean/**
      - spec/**
      - script/check_spec.py
      - script/check_provenance.py
      - script/axiom_allow.yaml
      - ci/docker/lean.Dockerfile
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify_lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container: debian:bookworm-slim@sha256:7c7b2c966bc9ee8cedfeef67e0e279108992c77681fa595db4a9d65c06ccc587
    steps:
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends curl git ca-certificates zstd python3 python3-yaml > /dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/elan
            verification/lean/.lake/build
          key: lean-${{ hashFiles('verification/lean/lean-toolchain', 'verification/lean/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lean-${{ hashFiles('verification/lean/lean-toolchain', 'verification/lean/lake-manifest.json') }}-
      - name: install elan
        run: |
          export ELAN_HOME="$GITHUB_WORKSPACE/.cache/elan"
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain "$(cat verification/lean/lean-toolchain)"
          echo "ELAN_HOME=$ELAN_HOME" >> "$GITHUB_ENV"
          echo "$ELAN_HOME/bin" >> "$GITHUB_PATH"
      - run: cd verification/lean && lake exe cache get && lake build
      - run: python3 script/check_spec.py --run --strict --prover lean --no-report
