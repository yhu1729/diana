name: verify_provenance

on:
  push:
    branches: ['**']
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
    paths:
      - .github/workflows/verify_provenance.yml
      - .gitignore
      - include/**
      - spec/**
      - src/**
      - verification/**
      - doc/verification/report.md
      - script/check_provenance.py
      - script/axiom_allow.yaml
      - script/run_frama_c.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify_provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 script/check_provenance.py
