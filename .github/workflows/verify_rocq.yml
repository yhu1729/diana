name: verify_rocq

on:
  push:
    branches: ['**']
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
    paths:
      - .github/workflows/verify_rocq.yml
      - verification/rocq/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify_rocq:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ROCQ_IMAGE: mathcomp/mathcomp:2.6.0-rocq-prover-9.2@sha256:a4e066dbe94d40fbbefc2ab7692abb905011a053d1a5434ababee659ffe293e8
      COQUELICOT_VERSION: 3.4.5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: chmod -R a+rwX .
      - run: docker run --rm -v "$PWD:/work" -w /work -e COQUELICOT_VERSION "$ROCQ_IMAGE" sh -c 'rocq --version && opam update -y rocq-released && opam install -y "coq-coquelicot.$COQUELICOT_VERSION" && cd verification/rocq && make real'
