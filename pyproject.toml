[build-system]
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[project]
name = "diana"
version = "1.0.0"
description = "Formally verified numerical methods in C, with a Python binding"
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Yifan Hu" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: C",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://gitlab.com/yhu1729/diana"
Changelog = "https://gitlab.com/yhu1729/diana/-/blob/main/CHANGELOG.md"
Issues = "https://gitlab.com/yhu1729/diana/-/issues"

[dependency-groups]
test = ["pytest>=8", "numpy>=2", "mpmath>=1.3", "hypothesis>=6", "pyyaml>=6"]
lint = ["ruff>=0.6", "clang-format==23.1.3"]
spec = ["pyyaml>=6"]
coverage = ["pytest-cov>=5", "gcovr>=8"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.source-dir = "."
cmake.args = ["-DDIANA_BUILD_PYTHON=ON", "-DDIANA_BUILD_TEST=OFF"]
wheel.packages = ["python/src/diana"]
sdist.include = ["include/**", "src/**", "cmake/**", "python/src/**", "python/ext/**", "CMakeLists.txt"]
sdist.exclude = ["verification/**", "ci/**", "build/**"]
build-dir = "build/{wheel_tag}"

[tool.pytest.ini_options]
testpaths = ["test/python", "test/doc"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["python/src", "test/python", "test/doc", "script"]

[tool.ruff.per-file-target-version]
"script/**" = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
